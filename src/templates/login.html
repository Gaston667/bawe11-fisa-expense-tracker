{% extends "base.html" %}

{% block title %}Se connecter — Expense Tracker{% endblock %}

{% block content %}
<section class="auth-section">
    <div class="auth-card">
        <h1 class="auth-title" data-fr="Se connecter" data-en="Log in">
            Se connecter
        </h1>

        <form method="post" action="{{ url_for('auth.login') }}" class="auth-form" novalidate>
            <!-- Email -->
            <div class="form-group">
                <label for="email" class="form-label"
                       data-fr="Email" data-en="Email">
                    Email
                </label>
                <div class="input-wrapper">
                    <span class="input-icon" aria-hidden="true">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="2" y="4" width="20" height="16" rx="2"></rect>
                            <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
                        </svg>
                    </span>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        class="form-input"
                        placeholder="Ex. diallo@email.com"
                        data-placeholder-fr="Ex. diallo@email.com"
                        data-placeholder-en="E.g. diallo@email.com"
                        autocomplete="email"
                        inputmode="email"
                        required
                    >
                </div>
            </div>

            <!-- Password -->
            <div class="form-group">
                <label for="password" class="form-label"
                       data-fr="Mot de passe" data-en="Password">
                    Mot de passe
                </label>
                <div class="input-wrapper">
                    <span class="input-icon" aria-hidden="true">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                    </span>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        class="form-input"
                        placeholder="Ex. ********"
                        data-placeholder-fr="Ex. ********"
                        data-placeholder-en="E.g. ********"
                        autocomplete="current-password"
                        required
                    >
                    <button type="button" class="password-toggle" data-password-toggle="password"
                            aria-label="Afficher le mot de passe" data-aria-fr="Afficher le mot de passe" data-aria-en="Show password">
                        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"></path><circle cx="12" cy="12" r="2.5"></circle></svg>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn-submit"
                    data-fr="Se connecter" data-en="Log in">
                Se connecter
            </button>
        </form>

        <p class="auth-switch">
            <span data-fr="Pas encore de compte ?" data-en="Don't have an account yet?">
                Pas encore de compte ?
            </span>
            <a href="{{ url_for('auth.register') }}" class="auth-switch-link"
               data-fr="Créer un compte" data-en="Create an account">
                Créer un compte
            </a>
        </p>
    </div>
</section>
{% endblock %}
