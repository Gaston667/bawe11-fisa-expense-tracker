{% extends "base.html" %}

{% block title %}Créer un compte — Expense Tracker{% endblock %}

{% block content %}
<section class="auth-section">
    <div class="auth-card">
        <h1 class="auth-title" data-fr="Créer un compte" data-en="Create an account">
            Créer un compte
        </h1>

        <form method="post" action="{{ url_for('auth.register') }}" class="auth-form" novalidate>
            <!-- Username -->
            <div class="form-group">
                <label for="username" class="form-label"
                       data-fr="Nom d'utilisateur" data-en="Username">
                    Nom d'utilisateur
                </label>
                <div class="input-wrapper">
                    <span class="input-icon" aria-hidden="true">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                    </span>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        class="form-input"
                        placeholder="Ex. diallo"
                        data-placeholder-fr="Ex. diallo"
                        data-placeholder-en="E.g. diallo"
                        autocomplete="username"
                        maxlength="25"
                        required
                    >
                </div>
            </div>

            <!-- Email -->
            <div class="form-group">
                <label for="email" class="form-label"
                       data-fr="Email" data-en="Email">
                    Email
                </label>
                <div class="input-wrapper">
                    <span class="input-icon" aria-hidden="true">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="2" y="4" width="20" height="16" rx="2"></rect>
                            <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
                        </svg>
                    </span>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        class="form-input"
                        placeholder="Ex. diallo@email.com"
                        data-placeholder-fr="Ex. diallo@email.com"
                        data-placeholder-en="E.g. diallo@email.com"
                        autocomplete="email"
                        inputmode="email"
                        maxlength="100"
                        required
                    >
                </div>
            </div>

            <!-- Password -->
            <div class="form-group">
                <label for="password" class="form-label"
                       data-fr="Mot de passe" data-en="Password">
                    Mot de passe
                </label>
                <div class="input-wrapper">
                    <span class="input-icon" aria-hidden="true">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                    </span>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        class="form-input"
                        placeholder="Ex. ********"
                        data-placeholder-fr="Ex. ********"
                        data-placeholder-en="E.g. ********"
                        autocomplete="new-password"
                        minlength="4"
                        required
                    >
                    <button type="button" class="password-toggle" data-password-toggle="password"
                            aria-label="Afficher le mot de passe" data-aria-fr="Afficher le mot de passe" data-aria-en="Show password">
                        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"></path><circle cx="12" cy="12" r="2.5"></circle></svg>
                    </button>
                </div>
            </div>

            <!-- Monthly Budget (optional) -->
            <div class="form-group">
                <label for="monthly_budget" class="form-label"
                       data-fr="Budget mensuel (optionnel)" data-en="Monthly budget (optional)">
                    Budget mensuel (optionnel)
                </label>
                <div class="input-wrapper">
                    <span class="input-icon" aria-hidden="true">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <ellipse cx="12" cy="5" rx="8" ry="3"></ellipse>
                            <path d="M4 5v6c0 1.66 3.58 3 8 3s8-1.34 8-3V5"></path>
                            <path d="M4 11v6c0 1.66 3.58 3 8 3s8-1.34 8-3v-6"></path>
                        </svg>
                    </span>
                    <input
                        type="number"
                        id="monthly_budget"
                        name="monthly_budget"
                        class="form-input"
                        placeholder="Ex. 500"
                        data-placeholder-fr="Ex. 500"
                        data-placeholder-en="E.g. 500"
                        step="0.01"
                        min="0"
                        inputmode="decimal"
                    >
                </div>
            </div>

            <button type="submit" class="btn-submit"
                    data-fr="S'inscrire" data-en="Sign up">
                S'inscrire
            </button>
        </form>

        <p class="auth-switch">
            <span data-fr="J'ai déjà un compte ?" data-en="Already have an account?">
                J'ai déjà un compte ?
            </span>
            <a href="{{ url_for('auth.login') }}" class="auth-switch-link"
               data-fr="Se connecter" data-en="Log in">
                Se connecter
            </a>
        </p>
    </div>
</section>
{% endblock %}
